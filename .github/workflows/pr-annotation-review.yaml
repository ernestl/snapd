name: PR annotation review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - edited
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-annotation-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the base commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run the PR annotation review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release-tools/pr-annotation-review.py \
            "${{ github.event.pull_request.html_url }}" \
            --publish
